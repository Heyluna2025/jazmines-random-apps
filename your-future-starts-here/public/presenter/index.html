<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160b3a">
<title>Presenter · Your Future Starts Here</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/base.css">
<style>
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  .top h1 { font-size: 1.4rem; margin: 0; }
  .top .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.2em; background: var(--lavender-300); color: var(--violet-900); padding: 4px 12px; border-radius: 8px; font-weight: 900; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .span-all { grid-column: 1 / -1; }
  .slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 12px; }
  .slide-btn { text-align: left; padding: 10px 12px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .slide-btn:hover { background: var(--surface-2); }
  .slide-btn.current { background: var(--lavender-300); color: var(--violet-900); border-color: var(--lavender-300); }
  .slide-btn .n { font-weight: 900; margin-right: 6px; }
  .slide-btn .hint { display: block; font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }
  .current-slide { font-size: 1.3rem; font-weight: 900; }
  .activity h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .qr { width: 140px; height: 140px; border-radius: 12px; background: white; padding: 6px; }
  .join-url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; font-size: 1.05rem; overflow-wrap: anywhere; }
  .stat { font-size: 2rem; font-weight: 900; line-height: 1; }
  .stat-label { color: var(--text-dim); font-size: 0.85rem; }
  .session-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .session-row:last-child { border-bottom: 0; }
  .login { max-width: 420px; margin: 60px auto; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--lavender-200); color: var(--violet-900); font-weight: 800; box-shadow: var(--shadow); z-index: 10; }
  .danger-zone { border-color: rgba(255, 123, 156, 0.35); }
  .tie-pick { margin-top: 10px; }
  .grid > .notice { margin: 0; }

  /* Thumb-reach bar for running the talk from a phone */
  .quickbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(16, 8, 44, 0.96); border-top: 1px solid var(--border); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .quickbar .qb-title { min-width: 0; }
  .quickbar .qb-title strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quickbar .qb-action { grid-column: 1 / -1; }

  @media (max-width: 720px) {
    .wrap { padding: 12px 12px 150px; }
    .top { gap: 8px; margin-bottom: 14px; }
    .top h1 { font-size: 1.1rem; min-width: 0; flex: 1 1 100%; order: 10; }
    .top .logo-text { display: none; }
    .grid { gap: 12px; }
    .card { padding: 16px; }
    .slides { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .slide-btn { padding: 8px 10px; font-size: 0.9rem; }
    .slide-btn .hint { display: none; }
    .stat { font-size: 1.6rem; }
    .login { margin: 24px auto; }
    .session-row .faint { display: none; }
    .quickbar { display: grid; }
  }
</style>
</head>
<body>
<div id="app" class="wrap"><div class="card center"><p class="muted">Loading…</p></div></div>
<script src="/shared/net.js"></script>
<script src="/shared/logo.js"></script>
<script src="/presenter/presenter.js"></script>
</body>
</html>
