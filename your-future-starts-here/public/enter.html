<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160b3a">
<title>Your Future Starts Here</title>
<link rel="stylesheet" href="/shared/fonts.css?v=__BUILD__">
<link rel="stylesheet" href="/shared/base.css?v=__BUILD__">
<style>
  main { max-width: 440px; margin: 0 auto; padding: 48px 16px 40px; }
  .brand { font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lavender-300); font-weight: 800; margin-top: 18px; }
  h1 { font-size: 2.2rem; margin: 6px 0 4px; }
  .code-input { text-transform: uppercase; letter-spacing: 0.3em; font-size: 1.8rem; text-align: center; font-weight: 800; min-height: 72px; }
  footer { margin-top: 48px; text-align: center; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <div data-logo="md"></div>
  <div class="brand">AI and the Future of Work</div>
  <h1>Your Future Starts Here</h1>
  <p class="muted">Scan the QR code on the big screen, or type the session code.</p>
  <p id="nolive" class="notice warn" hidden>No session is live right now. Ask for the 4-letter code on the screen, or scan again in a moment.</p>
  <form id="join" class="card stack" autocomplete="off">
    <label class="field">
      <span class="label">Session code</span>
      <input class="input code-input" name="code" id="code" maxlength="4" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD" required>
    </label>
    <p id="err" class="notice danger" hidden></p>
    <button class="btn block" type="submit">Join</button>
  </form>
  <footer class="faint">AI Empowered Club</footer>
</main>
<script src="/shared/logo.js?v=__BUILD__"></script>
<script>
  const form = document.getElementById('join');
  const err = document.getElementById('err');
  if (new URLSearchParams(location.search).get('nolive')) document.getElementById('nolive').hidden = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = form.code.value.trim().toUpperCase();
    err.hidden = true;
    if (!/^[A-HJ-NP-Z2-9]{4}$/.test(code)) { err.textContent = 'Codes are 4 letters or numbers (no O, 0, I or 1).'; err.hidden = false; return; }
    const res = await fetch(`/api/sessions/${code}/state`).catch(() => null);
    if (!res || !res.ok) { err.textContent = 'Session not found. Check the code on the screen.'; err.hidden = false; return; }
    location.href = `/a/${code}`;
  });
</script>
</body>
</html>
