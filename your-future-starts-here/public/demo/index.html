<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160b3a">
<title>Snack demo · Your Future Starts Here</title>
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/base.css">
<style>
  body { font-size: 18px; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; background: rgba(16, 8, 44, 0.92); border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .bar label { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  .bar select { font: inherit; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .bar .toggle { display: inline-flex; align-items: center; gap: 8px; }
  .bar .toggle input { width: 20px; height: 20px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 20px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  .phone { background: var(--lavender-100); color: var(--violet-800); border-radius: 28px; padding: 22px; box-shadow: var(--shadow); }
  .phone h1 { font-size: 1.6rem; }
  .demo-badge { display: inline-block; background: var(--violet-700); color: #fff; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 900; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
  .snack { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(58, 36, 135, 0.15); }
  .snack:last-child { border-bottom: 0; }
  .snack .emoji { font-size: 2rem; }
  .snack .name { font-weight: 900; font-size: 1.1rem; }
  .snack .price { color: var(--lavender-500); font-weight: 800; }
  .snack .stock { font-size: 0.85rem; font-weight: 800; margin-top: 2px; }
  .snack .stock.low { color: #b3541e; }
  .snack .stock.out { color: #b0244d; }
  .snack.soldout { opacity: 0.55; }
  .stepper { display: inline-flex; align-items: center; border: 2px solid var(--lavender-400); border-radius: 999px; overflow: hidden; }
  .stepper button { width: 44px; height: 44px; border: 0; background: transparent; color: var(--violet-800); font-size: 1.4rem; font-weight: 900; cursor: pointer; }
  .stepper button:disabled { opacity: 0.3; cursor: not-allowed; }
  .stepper .qty { min-width: 36px; text-align: center; font-weight: 900; font-size: 1.1rem; }
  .line-total { font-size: 0.85rem; color: rgba(31, 17, 80, 0.7); text-align: right; }
  .summary { margin-top: 16px; padding: 16px; border-radius: 16px; background: rgba(176, 154, 234, 0.25); }
  .summary .total { display: flex; justify-content: space-between; font-size: 1.4rem; font-weight: 900; }
  .summary ul { margin: 8px 0 0; padding-left: 18px; }
  .order-btn { margin-top: 16px; width: 100%; min-height: 56px; border-radius: 999px; border: 0; background: var(--violet-700); color: #fff; font: inherit; font-size: 1.1rem; font-weight: 900; cursor: pointer; }
  .order-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .side .card { margin-bottom: 14px; }
  .prompt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; white-space: pre-wrap; background: rgba(0, 0, 0, 0.25); padding: 12px; border-radius: 10px; }
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(16, 8, 44, 0.8); z-index: 20; padding: 16px; }
  .modal .card { max-width: 420px; }
  .change-tag { display: inline-block; background: var(--lavender-300); color: var(--violet-900); font-size: 0.72rem; font-weight: 900; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <span data-logo="sm"></span>
  <strong>Presenter controls</strong>
  <label>Branch <select id="branch"></select></label>
  <label class="toggle"><input type="checkbox" id="aiChange"> Apply the AI-assisted change</label>
  <label class="toggle"><input type="checkbox" id="mistake"> Sneak in a mistake (for “Would you trust this?”)</label>
  <span class="spacer"></span>
  <button class="btn ghost small" id="resetOrder">Reset order</button>
  <a class="btn ghost small" href="/presenter">Back to presenter ↗</a>
</div>
<div class="wrap">
  <div class="phone" id="phone"></div>
  <div class="side" id="side"></div>
</div>
<script src="/shared/net.js"></script>
<script src="/shared/logo.js"></script>
<script src="/demo/demo.js"></script>
</body>
</html>
